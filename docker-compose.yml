services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # gitignored; holds ANTHROPIC_API_KEY for agent/briefing_agent.py. Injected at
      # container runtime, not baked into the image.
      - backend/.env
    volumes:
      # the trained model (mlruns/) and cached data (data/) are gitignored and
      # produced by ml/train.py + the scripts/ pipeline -- mount them from the host
      # rather than baking them into the image. On a new machine (e.g. a Mac), run
      # that pipeline once there too (or copy these two folders over) before predictions
      # will work.
      - ./mlruns:/app/mlruns
      - ./data:/app/data
      # scripts/ and pipeline/ aren't imported by the running backend.main app (so
      # they're not COPYed into the image), but they need to be runnable via
      # `docker compose run --entrypoint python backend scripts/...` without a full
      # image rebuild every time they change -- mounted read-write same as the others
      - ./scripts:/app/scripts
      - ./pipeline:/app/pipeline

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      # live-mount source for hot reload; anonymous volume keeps the container's own
      # (Linux-built) node_modules instead of whatever the host has installed
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
